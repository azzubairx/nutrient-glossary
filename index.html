<!-- Set language, direction and theme before first paint (prevents a flash) -->
<script>
(function () {
  try {
    var qs = new URLSearchParams(location.search);
    var qLang = qs.get('lang'), qTheme = qs.get('theme');
    if (qLang === 'ar' || qLang === 'en') localStorage.setItem('ng_lang', qLang);
    if (qTheme === 'dark' || qTheme === 'light') localStorage.setItem('ng_theme', qTheme);

    var saved = localStorage.getItem('ng_lang');
    var auto = (navigator.language || 'en').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
    var l = saved || auto;
    document.documentElement.lang = l === 'ar' ? 'ar' : 'en-GB';
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
    var th = localStorage.getItem('ng_theme');
    if (th) document.documentElement.setAttribute('data-theme', th);
  } catch (e) {}
})();
</script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@dawod/thmanyah-font-web@1.2.0/sans.css">
<style>
  :root {
    color-scheme:light;
    --font-ar:'Thmanyah Sans','IBM Plex Sans Arabic','Segoe UI',system-ui,sans-serif;
    --cream:#faf6ef; --cream-2:#f3ede1; --card:#ffffff; --elevated:#ffffff;
    --ink:#20281f; --muted:#636b5f; --line:#e6ddc9;
    --forest:#24453a; --forest-2:#2f5c4c; --gold:#b68a46; --gold-ink:#8f6428; --gold-soft:#eadfc4;
    --sage:#8aa78f; --danger:#9d3333; --danger-bg:#fbeaea; --danger-line:#efc7c7;
    --ok:#245a3d; --ok-bg:#e7f3ec; --ok-line:#bddcc9;
    --warn:#8f5d14; --warn-bg:#fbf1e1; --warn-line:#e9d2a2;
    --radius:16px;
    --shadow:0 12px 30px -18px rgba(36,69,58,.24);
  }
  [data-theme="dark"] {
    color-scheme:dark;
    --cream:#121714; --cream-2:#1a221d; --card:#1e2722; --elevated:#242f29;
    --ink:#ece8df; --muted:#a6afa5; --line:#2e3a33;
    --forest:#9cc5b3; --forest-2:#b7d9ca; --gold:#d4a964; --gold-ink:#d4a964; --gold-soft:#322a1d;
    --sage:#6a8d75; --danger:#f29b9b; --danger-bg:#331e1e; --danger-line:#5e3333;
    --ok:#8ed4ad; --ok-bg:#1b2f24; --ok-line:#2e553f;
    --warn:#ecc17a; --warn-bg:#2e2618; --warn-line:#574525;
    --shadow:0 14px 34px -18px rgba(0,0,0,.6);
  }

  .skip-link {
    position:fixed; inset-inline-start:0; top:-64px; z-index:200;
    background:var(--ink); color:var(--cream); padding:11px 18px;
    border-radius:0 0 10px 0; font-size:.86rem; font-weight:600; text-decoration:none;
    transition:top .16s ease;
  }
  [dir="rtl"] .skip-link { border-radius:0 0 0 10px; }
  .skip-link:focus { top:0; }
  main:focus { outline:none; }

  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    margin:0; background:var(--cream); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif; line-height:1.65;
    transition:background-color .2s ease, color .2s ease;
  }
  [dir="rtl"] body {
    font-family:var(--font-ar); font-size:1.02rem; line-height:1.85;
    letter-spacing:0;
  }
  h1, h2, h3, .brand { font-family:'Fraunces',Georgia,serif; }
  [dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3, [dir="rtl"] .brand,
  [dir="rtl"] .letter-heading .big {
    font-family:var(--font-ar); font-weight:700; letter-spacing:0;
  }
  /* Thmanyah Sans ships 300/400/500/700/900 — keep Arabic at real weights */
  [dir="rtl"] h1 { font-weight:700; line-height:1.35; }
  [dir="rtl"] h3 { font-weight:700; }
  [dir="rtl"] .brand { font-weight:700; }
  [dir="rtl"] .hero p, [dir="rtl"] .card .summary { line-height:1.8; }

  button, input, select { font-family:inherit; }
  [dir="rtl"] input, [dir="rtl"] select, [dir="rtl"] textarea { font-size:1rem; }

  /* ---------- Topbar ---------- */
  .topbar {
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    padding:14px 28px; border-bottom:1px solid var(--line); background:var(--cream);
    position:sticky; top:0; z-index:40; backdrop-filter:blur(8px);
  }
  .brand-wrap { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .brand-credit {
    font-size:.66rem; letter-spacing:.06em; text-transform:uppercase; text-decoration:none;
    color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:3px 9px;
    transition:all .15s ease;
  }
  [dir="rtl"] .brand-credit { letter-spacing:0; text-transform:none; font-size:.72rem; }
  .brand-credit:hover { color:var(--forest-2); border-color:var(--gold); }
  .brand { font-size:1.3rem; font-weight:600; color:var(--forest); letter-spacing:.01em; }
  .brand span { color:var(--gold-ink); }
  .topbar nav { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .topbar nav button.tab-btn {
    background:none; border:1px solid transparent; font-size:.86rem; color:var(--muted);
    cursor:pointer; padding:7px 12px; border-radius:999px; transition:all .15s ease;
    display:inline-flex; align-items:center; gap:6px;
  }
  .topbar nav button.tab-btn:hover { color:var(--ink); background:var(--cream-2); }
  .topbar nav button.tab-btn.active {
    color:#fff; background:var(--forest); border-color:var(--forest); font-weight:600;
  }
  [data-theme="dark"] .topbar nav button.tab-btn.active { color:#121714; }
  .top-actions { display:flex; gap:8px; align-items:center; }
  .icon-btn {
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    padding:6px 12px; border-radius:999px; cursor:pointer; font-size:.8rem; font-weight:600;
    display:inline-flex; align-items:center; gap:5px; transition:border-color .15s ease;
  }
  .icon-btn:hover { border-color:var(--gold); }

  /* ---------- Hero ---------- */
  .hero {
    text-align:center; padding:48px 20px 44px;
    background:
      radial-gradient(760px 320px at 50% -80px, var(--gold-soft), transparent 70%),
      var(--cream);
  }
  .hero .kicker {
    display:inline-block; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--forest-2); background:var(--cream-2); border:1px solid var(--line);
    padding:6px 16px; border-radius:999px; margin-bottom:14px; font-weight:600;
  }
  [dir="rtl"] .hero .kicker { letter-spacing:0; }
  .hero h1 { font-size:clamp(1.9rem,4vw,2.85rem); font-weight:500; margin:0 0 12px; color:var(--forest); line-height:1.25; }
  .hero p { max-width:680px; margin:0 auto; color:var(--muted); font-size:1rem; }

  .stats-row {
    display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-top:20px;
  }
  .stat-pill {
    font-size:.78rem; color:var(--muted); background:var(--card); border:1px solid var(--line);
    padding:5px 12px; border-radius:999px;
  }
  .stat-pill strong { color:var(--forest); }

  .trust-row {
    display:flex; justify-content:center; gap:8px 18px; flex-wrap:wrap;
    margin-top:14px; font-size:.76rem; color:var(--muted);
  }
  .trust-row span { display:inline-flex; align-items:center; gap:5px; }
  .trust-row span::before { content:"✓"; color:var(--sage); font-weight:700; font-size:.82rem; }

  main { max-width:1160px; margin:0 auto; padding:0 22px 64px; }
  body.no-hero .hero { display:none; }
  body.no-hero main { padding-top:26px; }
  body.no-hero .panel-header { margin-top:0; }

  /* ---------- Toolbar & Filters ---------- */
  .toolbar {
    display:grid; grid-template-columns:minmax(0,1fr) 208px auto;
    grid-auto-rows:auto; gap:10px; align-items:center;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin:-22px 0 18px; box-shadow:var(--shadow);
    position:relative; z-index:5;
  }
  .adv-filters { grid-column:1 / -1; display:flex; gap:10px; flex-wrap:wrap; }
  .adv-filters.hidden { display:none; }
  .adv-filters select { flex:1 1 190px; }
  .more-btn { height:42px; padding:0 14px; font-size:.82rem; white-space:nowrap; }
  .more-btn[aria-expanded="true"] { border-color:var(--gold); background:var(--cream-2); }
  .search-wrap { position:relative; display:flex; align-items:center; min-width:0; }
  .search-wrap svg.search-ico {
    position:absolute; inset-inline-start:14px; top:50%; transform:translateY(-50%); opacity:.48; pointer-events:none;
  }
  .search-wrap input {
    width:100%; padding:10px 38px 10px 40px; border:1px solid var(--line); border-radius:10px;
    font-size:.94rem; background:var(--cream); color:var(--ink); outline:none;
  }
  [dir="rtl"] .search-wrap input { padding:10px 40px 10px 38px; }
  .search-wrap input:focus, select:focus { border-color:var(--gold); }
  .clear-btn {
    position:absolute; inset-inline-end:8px; background:none; border:none; color:var(--muted);
    cursor:pointer; font-size:1.1rem; line-height:1; padding:4px 7px; border-radius:6px; display:none;
  }
  .clear-btn.show { display:block; }
  .clear-btn:hover { background:var(--cream-2); color:var(--ink); }

  .toolbar select {
    width:100%; padding:10px 10px; border:1px solid var(--line); border-radius:10px;
    font-size:.86rem; background:var(--cream); color:var(--ink); outline:none; cursor:pointer;
  }

  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
  .subchips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
  .chip {
    border:1px solid var(--line); background:var(--card); color:var(--muted);
    padding:6px 14px; border-radius:999px; font-size:.8rem; cursor:pointer; font-weight:500;
    transition:all .15s ease; display:inline-flex; align-items:center; gap:6px;
  }
  .chip:hover { border-color:var(--gold); color:var(--ink); }
  .chip.active { background:var(--forest); color:#fff; border-color:var(--forest); font-weight:600; }
  [data-theme="dark"] .chip.active { color:#121714; }
  .chip.sub { padding:4px 11px; font-size:.75rem; }
  .chip .badge {
    font-size:.7rem; padding:1px 6px; border-radius:999px; background:rgba(128,128,128,.14);
  }
  .chip.active .badge { background:rgba(255,255,255,.22); }

  /* ---------- A-Z nav ---------- */
  .az-nav {
    display:flex; flex-wrap:wrap; gap:4px; justify-content:center;
    margin:0 0 22px; padding:12px; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius);
  }
  .az-nav a, .az-nav span.disabled {
    min-width:29px; height:29px; padding:0 6px; display:inline-flex; align-items:center; justify-content:center;
    border-radius:50%; text-decoration:none; font-size:.84rem; font-weight:600;
    font-family:'Fraunces',serif;
  }
  [dir="rtl"] .az-nav a, [dir="rtl"] .az-nav span.disabled { font-family:var(--font-ar); font-weight:500; }
  .az-nav a { color:var(--forest-2); }
  .az-nav a:hover { background:var(--gold-soft); }
  .az-nav span.disabled { color:var(--line); cursor:default; }

  .count-bar {
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
    margin:0 0 18px; color:var(--muted); font-size:.84rem;
  }
  .kbd-hint { font-size:.75rem; color:var(--muted); }
  kbd {
    background:var(--cream-2); border:1px solid var(--line); border-radius:5px;
    padding:1px 6px; font-size:.74rem; font-family:monospace;
  }

  /* ---------- Letter sections & Cards ---------- */
  .letter-section { margin-bottom:34px; scroll-margin-top:92px; }
  .letter-heading { display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  .letter-heading .big {
    font-size:1.65rem; color:var(--gold-ink); font-weight:600; min-width:34px;
  }
  .letter-heading .line { flex:1; height:1px; background:var(--line); }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(285px,100%),1fr)); gap:14px; }
  .card {
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 18px 16px; display:flex; flex-direction:column; gap:8px; min-width:0;
    transition:box-shadow .15s ease, transform .15s ease, border-color .15s ease;
  }
  .card:hover { box-shadow:0 16px 34px -22px rgba(36,69,58,.4); transform:translateY(-2px); border-color:var(--sage); }
  .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; flex-wrap:wrap; }
  .card h3 {
    margin:0; font-size:1.08rem; font-weight:600; color:var(--ink); cursor:pointer; line-height:1.3;
    min-width:0; overflow-wrap:break-word;
  }
  .card h3:hover { color:var(--forest-2); text-decoration:underline; text-underline-offset:3px; }
  .card h3:focus-visible { outline:2px solid var(--gold); outline-offset:3px; border-radius:4px; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
    outline:2px solid var(--gold); outline-offset:2px;
  }
  .card-actions { display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .star-btn {
    background:none; border:1px solid transparent; cursor:pointer; font-size:1rem; line-height:1;
    padding:3px 5px; border-radius:8px; color:var(--muted); transition:all .15s ease;
  }
  .star-btn:hover { background:var(--cream-2); color:var(--gold-ink); }
  .star-btn.saved { color:var(--gold-ink); }

  .tag {
    flex-shrink:0; font-size:.64rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    padding:3px 9px; border-radius:999px; white-space:nowrap;
  }
  [dir="rtl"] .tag { letter-spacing:0; font-size:.68rem; }
  .tag.Vitamin { background:#fdf1dc; color:#94620e; }
  .tag.Mineral { background:#e4ecf6; color:#2a4d7a; }
  .tag.Herb { background:#e7efe5; color:#2f5c3f; }
  .tag.Topic { background:#f1e7f4; color:#6a3b7a; }
  .tag.Other { background:#efe9df; color:#6b5c3a; }
  [data-theme="dark"] .tag.Vitamin { background:#3a2f1a; color:#f0c678; }
  [data-theme="dark"] .tag.Mineral { background:#1d2b3b; color:#9ec2ec; }
  [data-theme="dark"] .tag.Herb { background:#1c3024; color:#96d4aa; }
  [data-theme="dark"] .tag.Topic { background:#302036; color:#d2a8e0; }
  [data-theme="dark"] .tag.Other { background:#2b2820; color:#dcc79a; }

  .card .latin { font-size:.8rem; color:var(--muted); font-style:italic; margin:-2px 0 0; }
  .card .summary { font-size:.85rem; color:var(--ink); opacity:.88; margin:0; line-height:1.5; }
  .meta-pills { display:flex; flex-wrap:wrap; gap:6px; margin-top:2px; }
  .meta-pill {
    font-size:.71rem; color:var(--forest-2); background:var(--cream-2);
    border:1px solid var(--line); padding:2px 8px; border-radius:7px;
  }
  .meta-pill.warn { background:var(--warn-bg); border-color:var(--warn-line); color:var(--warn); }

  .card-foot {
    margin-top:auto; padding-top:8px; border-top:1px dashed var(--line);
    display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .card .links { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .card a.lnk, .detail-btn {
    color:var(--forest-2); text-decoration:none; font-size:.81rem; font-weight:600;
    border:none; background:none; padding:0; cursor:pointer; border-bottom:1px solid transparent;
  }
  .card a.lnk:hover, .detail-btn:hover { border-color:var(--forest-2); }
  .detail-btn { color:var(--gold-ink); }
  .detail-btn:hover { border-color:var(--gold); }
  .src {
    font-size:.68rem; color:var(--muted); background:var(--cream-2); padding:2px 7px; border-radius:6px;
  }

  /* ---------- Empty & Notices ---------- */
  .empty-state {
    text-align:center; padding:44px 20px; background:var(--card); border:1px dashed var(--line);
    border-radius:var(--radius); color:var(--muted);
  }
  .btn-primary, .btn-outline {
    padding:9px 18px; border-radius:10px; cursor:pointer; font-size:.88rem; font-weight:600;
    border:1px solid var(--forest); transition:all .15s ease;
  }
  .btn-primary { background:var(--forest); color:#fff; }
  [data-theme="dark"] .btn-primary { color:#121714; }
  .btn-primary:hover { background:var(--forest-2); }
  .btn-outline { background:transparent; color:var(--forest); }
  .btn-outline:hover { background:var(--cream-2); }

  .notice {
    background:var(--cream-2); border:1px solid var(--line); padding:14px 18px; border-radius:var(--radius);
    font-size:.86rem; color:var(--muted); margin:24px 0;
  }
  .notice strong { color:var(--ink); }
  .notice.warn { background:var(--warn-bg); border-color:var(--warn-line); color:var(--warn); }
  .notice a { color:var(--forest-2); }

  .hidden { display:none !important; }

  /* ---------- Interactions & Timing Panel ---------- */
  .panel-header {
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 22px; margin:-22px 0 20px; box-shadow:var(--shadow);
  }
  .panel-header h2 { margin:0 0 6px; font-size:1.35rem; color:var(--forest); }
  .panel-header p { margin:0; font-size:.9rem; color:var(--muted); }

  .picker-box {
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; margin-bottom:20px;
  }
  .picker-title { font-size:.86rem; font-weight:600; margin:0 0 10px; color:var(--ink); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .pick-pills { display:flex; flex-wrap:wrap; gap:7px; }
  .pick-pill {
    border:1px solid var(--line); background:var(--cream); color:var(--ink);
    padding:5px 12px; border-radius:999px; font-size:.8rem; cursor:pointer; transition:all .15s;
  }
  .pick-pill:hover { border-color:var(--gold); }
  .pick-pill.selected { background:var(--forest); color:#fff; border-color:var(--forest); font-weight:600; }
  [data-theme="dark"] .pick-pill.selected { color:#121714; }

  .inter-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:14px; margin-bottom:26px; }
  .inter-card {
    border-radius:var(--radius); padding:16px 18px; border:1px solid var(--line); background:var(--card);
  }
  .inter-card.synergy { background:var(--ok-bg); border-color:var(--ok-line); }
  .inter-card.antagonism { background:var(--warn-bg); border-color:var(--warn-line); }
  .inter-card.caution { background:var(--danger-bg); border-color:var(--danger-line); }
  .inter-badge {
    display:inline-block; font-size:.7rem; font-weight:700; text-transform:uppercase;
    padding:2px 8px; border-radius:999px; margin-bottom:8px;
  }
  .inter-card.synergy .inter-badge { background:var(--ok); color:#fff; }

  "Cinnamon": { ar: "القرفة", aliases: ["Cinnamomum", "قرفة"], role: "Studied for blood sugar support (evidence remains inconclusive).", roleAr: "تُدرس لدعم سكر الدم (الأدلة غير حاسمة).", tips: "Cassia cinnamon is high in coumarin, which in heavy supplement doses can stress the liver; Ceylon cinnamon is much lower in coumarin.", tipsAr: "قرفة الكاسيا عالية الكومارين، الذي قد يرهق الكبد عند الإفراط في المكملات؛ أما قرفة سيلان فتحتوي على نسبة أقل بكثير." },
  "Fenugreek": { ar: "الحلبة", aliases: ["Trigonella foenum-graecum", "حلبة"], role: "Studied for blood sugar control and lactation support.", roleAr: "تُدرس لسكر الدم وإدرار الحليب.", tips: "May lower blood glucose and interact with diabetes meds or warfarin; avoid concentrated doses during pregnancy.", tipsAr: "قد تخفض سكر الدم وتتداخل مع أدوية السكري والوارفارين؛ تُتجنب الجرعات المركزة أثناء الحمل." },
  "Licorice root": { ar: "عرق السوس", aliases: ["Glycyrrhiza glabra", "عرق سوس"], role: "Used for soothing GI/throat irritation; DGL removes glycyrrhizin.", roleAr: "يُستخدم لتهدئة المعدة والحلق (النوع DGL منزوع الغليسيريزين).", tips: "Whole licorice (glycyrrhizin) raises blood pressure and drops potassium dangerously if overused.", tipsAr: "عرق السوس الكامل (الغليسيريزين) يرفع ضغط الدم ويخفض البوتاسيوم بشكل خطير عند الإفراط، وخاصة لدى مرضى الضغط." },
  "Peppermint oil": { ar: "زيت النعناع الفلفلي", aliases: ["Mentha piperita", "نعناع"], role: "Enteric-coated capsules show benefit for IBS abdominal cramps.", roleAr: "الكبسولات المغلفة معوياً تفيد في تقلصات القولون العصبي.", tips: "Can worsen acid reflux (GERD) if not enteric-coated.", tipsAr: "قد يزيد ارتجاع المريء إذا لم يكن مغلفاً معوياً." },
  "Soy": { ar: "الصويا (الأيزوفلافون)", aliases: ["Glycine max", "Isoflavones", "صويا"], role: "Source of phytoestrogens studied for menopausal hot flashes and cholesterol.", roleAr: "مصدر للفيتواستروجين يُدرس لأعراض سن اليأس والكوليسترول.", tips: "Whole soy foods are safe; consult an oncologist before concentrated isoflavone pills in hormone-receptor-positive breast cancer.", tipsAr: "أغذية الصويا الكاملة آمنة؛ استشر الطبيب قبل حبوب الأيزوفلافون المركزة." },

  "Lavender": { ar: "اللافندر (الخزامى)", aliases: ["Lavandula", "لافندر", "خزامى"], role: "Studied via aromatherapy and oral preparations for mild anxiety.", roleAr: "يُدرس عبر الاستنشاق أو المستخلصات الفموية للقلق الخفيف.", tips: "Essential oils should never be swallowed undiluted.", tipsAr: "الزيوت العطرية لا تُبلع مباشرة دون تخفيف أو مستحضر مخصص." },
  "Passionflower": { ar: "زهرة الآلام", aliases: ["Passiflora incarnata", "زهرة الآلام"], role: "Traditionally used for mild anxiety and sleep.", roleAr: "تُستخدم تقليدياً للتوتر الخفيف والنوم.", tips: "Avoid combining with sedatives; avoid during pregnancy.", tipsAr: "تجنب دمجها مع المهدئات وأثناء الحمل." },
  "Bromelain": { ar: "البروميلين", aliases: ["Pineapple enzyme", "بروميلين"], role: "Protein-digesting enzyme from pineapple studied for swelling/sinus inflammation.", roleAr: "إنزيم من الأناناس يُدرس لتخفيف التورم والالتهابات.", tips: "May increase bleeding risk with anticoagulants and increase absorption of certain antibiotics.", tipsAr: "قد يزيد خطر النزيف مع مميعات الدم، ويزيد امتصاص بعض المضادات الحيوية." },
  "Butterbur": { ar: "البوتيربور (الأرام)", aliases: ["Petasites hybridus"], role: "Studied for migraine prevention and allergic rhinitis.", roleAr: "يُدرس للوقاية من الشقيقة وحساسية الأنف.", tips: "Use ONLY products certified free of pyrrolizidine alkaloids (PA-free): these alkaloids can cause severe liver damage.", tipsAr: "استخدم فقط المنتجات الموثقة بخلوها من قلويدات البيروليزيدين (PA-free) السامة للكبد." },
  "Bitter orange": { ar: "النارنج (البرتقال المر)", aliases: ["Citrus aurantium", "Synephrine", "نارنج"], role: "Promoted for weight loss (contains p-synephrine).", roleAr: "يُروج له لإنقاص الوزن (يحوي السينفرين).", tips: "Can elevate heart rate and blood pressure, especially combined with caffeine; avoid in cardiovascular disease.", tipsAr: "قد يرفع ضغط الدم ونبض القلب، خاصة مع الكافيين؛ يُتجنب في أمراض القلب والأوعية." },
  "Yohimbe": { ar: "اليوهيمبي", aliases: ["Pausinystalia yohimbe", "Yohimbine", "يوهيمبي"], role: "Promoted for erectile dysfunction and athletic fat loss.", roleAr: "يُروج له للقدرة الجنسية وحرق الدهون.", tips: "SAFETY WARNING: Frequently causes rapid heart rate, high blood pressure, anxiety, and dangerous drug interactions.", tipsAr: "تحذير: قد يسبب تسارع نبض القلب وارتفاع الضغط والقلق الشديد." },
  "Goldenseal": { ar: "خاتم الذهب", aliases: ["Hydrastis canadensis", "Berberine"], role: "Contains berberine; traditionally used for mucosal/GI support.", roleAr: "يحوي البربارين، ويُستخدم تقليدياً لدعم الأغشية المخاطية والجهاز الهضمي.", tips: "Inhibits CYP2D6 & CYP3A4 liver enzymes, altering blood levels of many prescription drugs.", tipsAr: "يثبط إنزيمات الكبد CYP وقد يغير مستويات أدوية عديدة." },
  "Acai": { ar: "الآساي", aliases: ["آساي"], role: "Antioxidant-rich palm berry; limited clinical proof for weight loss or anti-aging.", roleAr: "ثمار غنية بمضادات الأكسدة، دون أدلة قوية على إنقاص الوزن.", tips: "No strong clinical evidence supports weight-loss or anti-ageing claims; whole foods remain the better antioxidant source.", tipsAr: "لا توجد أدلة سريرية قوية لإنقاص الوزن أو مقاومة الشيخوخة؛ الاعتماد على الغذاء الكامل أفضل لمضادات الأكسدة." },
  "Alfalfa": { ar: "البرسيم الحجازي (الفصفصة)", aliases: ["فصفصة"], role: "Traditionally used for cholesterol and nutrition.", roleAr: "يُستخدم تقليدياً لخفض الكوليسترول.", tips: "Raw sprouts carry bacterial contamination risks; high doses may trigger lupus flares or interact with warfarin (vitamin K content). MedlinePlus no longer hosts a standalone alfalfa monograph, so the link opens its live A–Z herbs index.", tipsAr: "قد يتداخل مع الوارفارين لاحتوائه على فيتامين ك، ويُحذر لمرضى الذئبة. لم يعد MedlinePlus يستضيف صفحة مستقلة للفصفصة، لذا يفتح الرابط فهرسه الحي للأعشاب." },
  "Aloe vera": { ar: "الألوفيرا (الصبار)", aliases: ["صبار", "ألوفيرا"], role: "Topical gel soothes mild burns/skin; oral aloe latex is a harsh stimulant laxative.", roleAr: "الجل الموضعي يهدئ الحروق الخفيفة؛ أما خلاصة الصبار الفموية فملين قوي قد يضر.", tips: "Oral non-decolorized whole-leaf aloe extract carries safety warnings (cramps, electrolyte loss).", tipsAr: "تجنب المستخلص الفموي غير المنقى لما يسببه من تقلصات وإسهال وفقدان أملاح." },
  "Astragalus": { ar: "القتاد (الأستراغالوس)", aliases: ["أستراغالوس"], role: "Traditional Chinese herb studied for immune and fatigue support.", roleAr: "عشبة تقليدية تُدرس لدعم المناعة.", tips: "May interact with immunosuppressant medications.", tipsAr: "قد يتعارض مع الأدوية المثبطة للمناعة." },
  "Bee pollen": { ar: "حبوب لقاح النحل", aliases: ["لقاح النحل"], role: "Nutrient-dense bee product promoted for energy/allergies.", roleAr: "منتج نحلي يُروج له للطاقة.", tips: "Can trigger severe allergic reactions (anaphylaxis) in pollen/bee-allergic individuals; may interact with warfarin. Linked to the MedlinePlus A–Z herbs index because no standalone monograph is published.", tipsAr: "قد يسبب حساسية شديدة لمن يتحسس من حبوب اللقاح أو لسعات النحل. الرابط يفتح فهرس الأعشاب في MedlinePlus لعدم توفر صفحة مستقلة." },
  "Bilberry": { ar: "العنبية (التوت الأزرق البري)", aliases: ["عنبية"], role: "Anthocyanin-rich berry studied for eye/vascular support.", roleAr: "ثمار غنية بالأنثوسيانين تُدرس لصحة العين والأوعية.", tips: "Leaf extracts in high doses are unsafe long-term; fruit is generally safe.", tipsAr: "ثماره آمنة عموماً، أما مستخلص الأوراق بجرعات عالية فغير آمن على المدى الطويل." },
  "Cat's claw": { ar: "مخلب القط", aliases: ["مخلب القط"], role: "Amazonian vine studied for osteoarthritis/rheumatoid inflammation.", roleAr: "نبات يُدرس لالتهابات المفاصل.", tips: "May interact with blood pressure, blood-thinning, and immunosuppressant drugs.", tipsAr: "قد يتداخل مع أدوية الضغط والمناعة." },
  "Chasteberry": { ar: "كف مريم", aliases: ["Vitex agnus-castus", "كف مريم"], role: "Studied for premenstrual syndrome (PMS) and cycle regularity.", roleAr: "يُدرس لمتلازمة ما قبل الحيض وتنظيم الدورة.", tips: "Affects dopamine/pituitary hormones; avoid with hormone therapy, birth control pills, or dopamine drugs.", tipsAr: "يؤثر على الهرمونات والدوبامين؛ تجنبه مع الحبوب الهرمونية." },
  "Dandelion": { ar: "الهندباء", aliases: ["هندباء"], role: "Leaves act as mild diuretic; root traditionally used for digestion.", roleAr: "الأوراق مدرة خفيفة للبول والجذر للهضم.", tips: "Caution with diuretics, lithium, or ragweed allergies.", tipsAr: "يُحذر مع مدرات البول أو الليثيوم أو حساسية عائلة الأقحوان." },
  "Evening primrose oil": { ar: "زيت زهرة الربيع المسائية", aliases: ["GLA", "زهرة الربيع"], role: "Source of gamma-linolenic acid (GLA) studied for eczema and breast pain.", roleAr: "مصدر لحمض GLA يُدرس للإكزيما وآلام الثدي.", tips: "Caution with blood thinners and seizure disorders.", tipsAr: "يُحذر مع مميعات الدم أو الصرع." },

  "Hawthorn": { ar: "الزعرور البري", aliases: ["زعرور"], role: "Studied for mild chronic heart failure support alongside standard care.", roleAr: "يُدرس لدعم قصور القلب المزمن الخفيف إلى جانب العلاج القياسي.", tips: "NEVER use for heart conditions without cardiologist supervision; interacts with digoxin and blood pressure meds.", tipsAr: "لا يُستخدم لأمراض القلب إلا بإشراف طبيب؛ يتداخل مع الديجوكسين وأدوية الضغط." },

  "Pomegranate": { ar: "الرمان", aliases: ["رمان"], role: "Polyphenol-rich fruit studied for cardiovascular antioxidant support.", roleAr: "غني بمضادات الأكسدة، ويُدرس لدعم صحة القلب.", tips: "Lab studies suggest the juice may inhibit CYP3A4, but human evidence is limited; check with a pharmacist if you take drugs with a narrow therapeutic index.", tipsAr: "تشير دراسات مخبرية إلى احتمال تثبيطه بعض إنزيمات الكبد، لكن الأدلة البشرية محدودة؛ راجع الصيدلي إن كنت تتناول أدوية ضيقة المجال العلاجي." },
  "Sage": { ar: "الميرمية", aliases: ["Salvia officinalis", "ميرمية"], role: "Studied for hot flashes, sore throat, and memory.", roleAr: "تُدرس للهبات الساخنة والذاكرة والتهاب الحلق.", tips: "Common culinary amounts are safe; large concentrated oil/extract doses contain thujone (neurotoxic).", tipsAr: "الكميات الغذائية آمنة؛ الزيت المركز عالي الثوجون سام للأعصاب." },

/* Alphabetical key — in Arabic, the definite article "ال" and diacritics are
   ignored so the index follows the conventional Arabic dictionary order. */
function sortKey(str){
  let s = (str || "").trim();
  if(lang === "ar"){
    s = s.replace(/[\u064B-\u0652\u0640]/g, "");
    if(s.startsWith("ال") && s.length > 3) s = s.slice(2);
  }
  return s;
}

/* Arabic collation is not guaranteed to be present in every engine, and
   locale-aware sorting puts hamza forms in the wrong place. Ranking each
   letter against the standard abjad gives one stable, correct order. */
const AR_ALPHA = "ابتثجحخدذرزسشصضطظعغفقكلمنهوي";

function arSortKey(str){
  return sortKey(str)
    .replace(/[أإآٱ]/g, "ا")
    .replace(/[ىئ]/g, "ي")
    .replace(/ة/g, "ه")
    .replace(/ؤ/g, "و")
    .toLowerCase();
}

function arRank(str){
  return [...arSortKey(str)].map(ch => {
    const i = AR_ALPHA.indexOf(ch);
    return i === -1 ? 100 + ch.codePointAt(0) : i;
  });
}

function cmpAr(a, b){
  const x = arRank(a), y = arRank(b);
  const n = Math.min(x.length, y.length);
  for(let i = 0; i < n; i++){
    if(x[i] !== y[i]) return x[i] - y[i];
  }
  return x.length - y.length;
}

function letterOf(str){
  const clean = sortKey(str).replace(/^[^A-Za-z\u0621-\u064A]+/, "");
  let ch = clean.charAt(0).toUpperCase();
  if(lang === "ar"){
    if("أإآ".includes(ch)) ch = "ا";
    if(ch === "ة") ch = "ت";
    if(ch === "ى") ch = "ي";
  }
  return ch || "#";
}

function matchesSearch(e, q){
  if(!q) return true;
  const hay = [
    e.name, e.ar, e.latin, e.role, e.roleAr, e.foods, e.foodsAr,
    ...(e.aliases || [])
  ].filter(Boolean).join(" ").toLowerCase();
  return hay.includes(q);
}

function renderGlossary(){
  const t = UI[lang];
  const q = $("filter").value.trim().toLowerCase();
  $("clearSearch").classList.toggle("show", q.length > 0);
  const src = $("sourceFilter").value;
  const sortMode = $("sortMode").value || "az";

  const filtered = ENTRIES.filter(e => {
    if(activeCat === "Saved" && !savedSet.has(e.name)) return false;
    else if(activeCat && activeCat !== "Saved" && e.cat !== activeCat) return false;
    if(activeSub && e.sub !== activeSub) return false;
    if(src && e.source !== src) return false;
    if(!matchesSearch(e, q)) return false;
    return true;
  });

  $("count").textContent = t.count(filtered.length, ENTRIES.length);

  if(!filtered.length){
    $("azNav").innerHTML = "";
    $("sections").innerHTML = `
      <div class="empty-state">
        <p>${t.emptyMsg}</p>
        <button class="btn-outline" id="resetBtn">${t.resetFilters}</button>
      </div>`;
    $("resetBtn").onclick = () => {
      $("filter").value = "";
      activeCat = ""; activeSub = "";
      $("category").value = "";
      $("sourceFilter").value = "";
      renderChips();
      renderGlossary();
    };
    return;
  }

  const sorted = [...filtered].sort((a, b) => lang === "ar"
    ? cmpAr(displayName(a), displayName(b))
    : sortKey(displayName(a)).localeCompare(sortKey(displayName(b)), "en"));

  if(sortMode === "cat"){
    $("azNav").classList.add("hidden");
    const catOrder = ["Vitamin", "Mineral", "Other", "Herb", "Topic"];
    const byCat = {};
    sorted.forEach(e => (byCat[e.cat] = byCat[e.cat] || []).push(e));
    $("sections").innerHTML = catOrder.filter(c => byCat[c]).map(c => `
      <div class="letter-section" id="C-${c}">
        <div class="letter-heading"><span class="big" style="font-size:1.35rem;width:auto;">${t.cats[c]}</span><span class="line"></span></div>
        <div class="grid">${byCat[c].map(renderCard).join("")}</div>
      </div>
    `).join("");
  } else {
    $("azNav").classList.remove("hidden");
    const byLetter = {};
    sorted.forEach(e => {
      const l = letterOf(displayName(e));
      (byLetter[l] = byLetter[l] || []).push(e);
    });
    const letters = Object.keys(byLetter).sort((a, b) => {
      if(lang !== "ar") return a.localeCompare(b, "en");
      const ia = AR_ALPHA.indexOf(a), ib = AR_ALPHA.indexOf(b);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
    });
    const alphabet = lang === "ar"
      ? ["ا","ب","ت","ث","ج","ح","خ","د","ذ","ر","ز","س","ش","ص","ض","ط","ظ","ع","غ","ف","ق","ك","ل","م","ن","ه","و","ي"]
      : "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    // Include any extra initial letters (e.g. from Arabic hamza/latin) if present
    const navLetters = [...new Set([...alphabet, ...letters])];
    $("azNav").innerHTML = navLetters.map(l =>
      byLetter[l]
        ? `<a href="#${letterId(l)}" aria-label="${esc(t.jumpTo)} ${esc(l)}">${esc(l)}</a>`
        : `<span class="disabled" aria-disabled="true">${esc(l)}</span>`
    ).join("");

    $("sections").innerHTML = letters.map(l => `
      <div class="letter-section" id="${letterId(l)}">
        <div class="letter-heading"><span class="big">${esc(l)}</span><span class="line"></span></div>
        <div class="grid">${byLetter[l].map(renderCard).join("")}</div>
      </div>
    `).join("");
  }
}

function renderCard(e){
  const t = UI[lang];
  const title = displayName(e);
  const secondary = lang === "ar" ? e.name : (e.ar || "");
  const subTxt = e.sub ? t.subLabels[e.sub] : "";
  const roleTxt = lang === "ar" ? (e.roleAr || e.role || "") : (e.role || "");
  const rdaTxt = lang === "ar" ? (e.rdaAr || e.rda) : e.rda;
  const isSaved = savedSet.has(e.name);
  const hasWarn = (e.tips || "").includes("WARNING") || (e.tips || "").includes("CAUTION");

  return `
  <article class="card" data-entry="${esc(e.name)}">
    <div class="card-top">
      <h3 class="open-modal" data-name="${esc(e.name)}" tabindex="0" role="button">${esc(title)}</h3>
      <div class="card-actions">
        <button class="star-btn ${isSaved ? "saved" : ""}" data-star="${esc(e.name)}" title="${esc(t.saveTitle)}" aria-label="${esc(t.saveTitle)}" aria-pressed="${isSaved}">${isSaved ? "★" : "☆"}</button>
        <span class="tag ${esc(e.cat)}">${esc(t.cats[e.cat] || e.cat)}</span>
      </div>
    </div>
    ${lang === "ar" && e.cat === "Topic" ? "" : (e.latin || secondary ? `<div class="latin">${esc([secondary, e.latin].filter(Boolean).join(" · "))}</div>` : "")}
    ${roleTxt ? `<p class="summary">${esc(bidiRanges(roleTxt))}</p>` : ""}
    <div class="meta-pills">
      ${subTxt ? `<span class="meta-pill">${esc(subTxt)}</span>` : ""}
      ${rdaTxt ? `<span class="meta-pill" dir="auto">${lang==="ar"?"الاحتياج":"RDA"}: ${esc(bidiRanges(rdaTxt))}</span>` : ""}
      ${hasWarn ? `<span class="meta-pill warn">⚠ ${lang==="ar" ? "تنبيه هام" : "Caution"}</span>` : ""}
    </div>
    <div class="card-foot">
      <div class="links">
        ${e.links.map(([lbl, url]) => `<a class="lnk" href="${esc(url)}" target="_blank" rel="noopener">${esc(t.linkLabels[lbl] || lbl)}</a>`).join("")}
        <span class="src">${esc(e.source)}</span>
      </div>
      <button class="detail-btn open-modal" data-name="${esc(e.name)}">${t.quickGuide}</button>
    </div>
  </article>`;
}

// Event delegation for card modal & bookmark clicks
$("sections").addEventListener("click", ev => {
  const star = ev.target.closest("[data-star]");
  if(star){
    const name = star.dataset.star;
    const nowSaved = !savedSet.has(name);
    if(nowSaved) savedSet.add(name);
    else savedSet.delete(name);
    savePrefs();
    star.classList.toggle("saved", nowSaved);
    star.setAttribute("aria-pressed", String(nowSaved));
    star.textContent = nowSaved ? "★" : "☆";
    const badge = document.querySelector('#catChips .chip[data-cat="Saved"] .badge');
    if(badge) badge.textContent = savedSet.size;
    if(activeCat === "Saved" && !nowSaved) renderGlossary();
    return;
  }
  const opener = ev.target.closest(".open-modal");
  if(opener){
    openModal(opener.dataset.name);
  }
});
$("sections").addEventListener("keydown", ev => {
  if(ev.key === "Enter" || ev.key === " ") {
    const opener = ev.target.closest(".open-modal");
    if(opener){ ev.preventDefault(); openModal(opener.dataset.name); }
  }
});

   8. DETAIL MODAL
   ============================================================================ */
let modalReturnFocus = null;

function openModal(name){
  const e = ENTRY_MAP[name];
  if(!e) return;
  const wasHidden = $("modalBackdrop").classList.contains("hidden");
  if(wasHidden) modalReturnFocus = document.activeElement;
  const t = UI[lang];
  const m = t.modal;

  const title = displayName(e);
  const subName = lang === "ar" ? e.name : (e.ar || "");
  $("modalBadges").innerHTML = `
    <span class="tag ${esc(e.cat)}">${esc(t.cats[e.cat] || e.cat)}</span>
    ${e.sub ? `<span class="meta-pill">${esc(t.subLabels[e.sub])}</span>` : ""}
    <span class="src">${esc(e.source)}</span>
  `;
  $("modalTitle").textContent = title;
  $("modalSub").textContent = [subName, e.cat === "Topic" ? "" : e.latin].filter(Boolean).join(" · ");

  const rda = lang === "ar" ? (e.rdaAr || e.rda) : e.rda;
  const ul = lang === "ar" ? (e.ulAr || e.ul) : e.ul;
  const role = lang === "ar" ? (e.roleAr || e.role) : e.role;
  const foods = lang === "ar" ? (e.foodsAr || e.foods) : e.foods;
  const tips = lang === "ar" ? (e.tipsAr || e.tips) : e.tips;
  const x = e.ng || {};
  const L = o => o ? (lang === "ar" ? (o.ar || o.en) : (o.en || o.ar)) : "";
  const tableHTML = tbl => {
    if(!tbl || !tbl.rows?.length) return "";
    const cols = ["age", "male", "female"];
    if(tbl.rows.some(r => r.pregnancy?.en)) cols.push("pregnancy");
    if(tbl.rows.some(r => r.lactation?.en)) cols.push("lactation");
    return `<div class="ng-table-wrap"><table class="ng-table">
      <thead><tr>${cols.map(c => `<th>${esc(L(tbl.headers[c]))}</th>`).join("")}</tr></thead>
      <tbody>${tbl.rows.map(r => `<tr>${cols.map(c => `<td class="${c === "age" ? "" : "num"}">${esc(bidiRanges(L(r[c]) || "—"))}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>${tbl.note ? `<p class="ng-src">${esc(bidiRanges(L(tbl.note)))}</p>` : ""}
      ${tbl.source ? `<p class="ng-src"><a href="${esc(tbl.source.url)}" target="_blank" rel="noopener">${esc(tbl.source.label)} ↗</a> · ${m.accessed} ${esc(fmtDate(tbl.source.accessed))}</p>` : ""}`;
  };

  let html = "";
  if(rda || ul){
    html += `<div class="fact-grid">
      ${rda ? `<div class="fact-box"><div class="lbl">${m.rda}</div><div class="val">${esc(bidiRanges(rda))}</div></div>` : ""}
      ${ul ? `<div class="fact-box"><div class="lbl">${m.ul}</div><div class="val">${esc(bidiRanges(ul))}</div></div>` : ""}
      ${x.classification ? `<div class="fact-box"><div class="lbl">${m.classif}</div><div class="val">${esc(L(x.classification))}</div></div>` : ""}
    </div>`;
  }
  if(role) html += `<div class="modal-sec"><h4>${m.role}</h4><p>${esc(bidiRanges(role))}</p></div>`;
  if(x.dri) html += `<div class="modal-sec"><h4>${m.dri} <span class="mini">NIH ODS</span></h4>${tableHTML(x.dri)}</div>`;
  if(x.ulTable) html += `<div class="modal-sec"><h4>${m.ulTable} <span class="mini">NIH ODS</span></h4>${tableHTML(x.ulTable)}</div>`;
  if(foods) html += `<div class="modal-sec"><h4>${m.foods}</h4><p>${esc(bidiRanges(foods))}</p></div>`;
  if(x.enhance || x.inhibit){
    html += `<div class="modal-sec"><h4>${m.absorption}</h4>`;
    if(x.enhance) html += `<p><strong>${m.enhance}:</strong> ${esc(bidiRanges(L(x.enhance)))}</p>`;
    if(x.inhibit) html += `<p><strong>${m.inhibit}:</strong> ${esc(bidiRanges(L(x.inhibit)))}</p>`;
    html += `</div>`;
  }
  if(x.drugs?.length){
    html += `<div class="modal-sec"><h4>${m.drugs}</h4><ul class="ng-list">${x.drugs.map(d =>
      `<li><span class="sev ${esc(d.sev || "info")}">${esc(m.severity[d.sev] || m.severity.info)}</span>${esc(bidiRanges(L(d)))}
        ${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener" aria-label="${esc(m.sources)}">↗</a>` : ""}</li>`).join("")}</ul></div>`;
  } else if(x.category === "Herb"){
    html += `<div class="modal-sec"><h4>${m.drugs}</h4><p>${m.noInteractions}</p></div>`;
  }
  if(x.deficiency) html += `<div class="modal-sec"><h4>${m.deficiency}</h4><p>${esc(bidiRanges(L(x.deficiency)))}</p></div>`;
  if(x.excess) html += `<div class="modal-sec"><h4>${m.excess}</h4><p>${esc(bidiRanges(L(x.excess)))}</p></div>`;
  if(x.ulNote) html += `<div class="modal-sec"><h4>${m.ulNote}</h4><p>${esc(bidiRanges(L(x.ulNote)))}</p></div>`;
  if(x.conflicts?.length){
    html += `<div class="modal-sec modal-sec--warn"><h4>${m.conflicts}</h4><ul class="ng-list">${x.conflicts.map(c => `<li>${esc(bidiRanges(L(c)))}</li>`).join("")}</ul></div>`;
  }
  if(x.unverified?.length){
    html += `<div class="modal-sec modal-sec--warn"><h4>${m.unverified}</h4><ul class="ng-list">${x.unverified.map(c => `<li>${esc(bidiRanges(L(c)))}</li>`).join("")}</ul></div>`;
  }
  if(tips && e.cat !== "Herb") html += `<div class="modal-sec"><h4>${m.tips}</h4><p>${esc(bidiRanges(tips))}</p></div>`;
  if(e.aliases?.length) html += `<div class="modal-sec"><h4>${m.aliases}</h4><p style="color:var(--muted);">${esc(e.aliases.join(" · "))}</p></div>`;

  if(x.sources?.length){
    html += `<div class="modal-sec"><h4>${m.sources}</h4>
      ${x.sources.map(s => `<span class="ng-src"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)} ↗</a> · ${m.accessed} ${esc(fmtDate(s.accessed))}</span>`).join("")}
      <p class="ng-meta">${esc(m.sourceNote)}</p>
    </div>`;
  }
  if(x.verified){
    html += `<p class="ng-meta">${m.verified}: ${esc(fmtDate(x.verified))} · ${m.nextReview}: ${esc(fmtDate(x.nextReview))} · ${esc(NG?.meta?.disclaimer? L(NG.meta.disclaimer) : m.disclaimerShort)}</p>`;
  }

  html += `<div class="modal-sec"><h4>${m.links}</h4><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;">
    ${e.links.map(([lbl, url]) => `<a class="btn-outline" style="text-decoration:none;font-size:.83rem;padding:6px 14px;" href="${esc(url)}" target="_blank" rel="noopener">${esc(t.linkLabels[lbl] || lbl)} (${esc(e.source)}) ↗</a>`).join("")}
  </div></div>`;

  const isSaved = savedSet.has(e.name);
  html += `<div class="modal-actions">
    <button class="btn-outline" id="modalStarBtn">${isSaved ? "★ " + (lang==="ar"?"محفوظ في قائمتي":"Saved") : "☆ " + t.saveTitle}</button>
    ${e.cat !== "Topic" ? `<button class="btn-primary" id="modalDsldBtn">${m.searchDsld}</button>` : ""}
  </div>`;

  $("modalBody").innerHTML = html;
  $("modalBackdrop").classList.remove("hidden");
  document.body.classList.add("modal-open");
  if(wasHidden) $("modalClose").focus();

  $("modalStarBtn").onclick = () => {
    if(savedSet.has(e.name)) savedSet.delete(e.name);
    else savedSet.add(e.name);
    savePrefs();
    renderChips();
    renderGlossary();
    openModal(e.name);
  };
  const dsldBtn = $("modalDsldBtn");
  if(dsldBtn){
    dsldBtn.onclick = () => {
      closeModal();
      showTab("labels");
      $("q").value = e.name.replace(/\s*\(.*?\)\s*/g, "");
      searchLabels(0);
      $("q").focus();
    };
  }
}

function closeModal(){
  if($("modalBackdrop").classList.contains("hidden")) return;
  $("modalBackdrop").classList.add("hidden");
  document.body.classList.remove("modal-open");
  if(modalReturnFocus && document.contains(modalReturnFocus)){
    modalReturnFocus.focus();
    if(modalReturnFocus.closest(".card")) modalReturnFocus.scrollIntoView({ block:"nearest" });
  }
  modalReturnFocus = null;
}
$("modalClose").onclick = closeModal;
$("modalBackdrop").addEventListener("click", ev => { if(ev.target === $("modalBackdrop")) closeModal(); });
$("modalBackdrop").addEventListener("keydown", ev => {
  if(ev.key !== "Tab") return;
  const focusables = [...$("modalBackdrop").querySelectorAll(
    'a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])'
  )].filter(el => el.offsetParent !== null);
  if(!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length - 1];
  if(ev.shiftKey && document.activeElement === first){ ev.preventDefault(); last.focus(); }
  else if(!ev.shiftKey && document.activeElement === last){ ev.preventDefault(); first.focus(); }
});

/* ============================================================================
   9b. COMPLETE PDF EXPORT
   Builds a self-contained print document (cover, contents, every entry,
   sources and verification dates) and prints only that document.
   ============================================================================ */
function buildPrintDocument(){
  const root = $("printRoot");
  if(!root) return;
  const t = UI[lang], m = t.modal, p = t.pdf;
  const meta = (NG && NG.meta) || {};
  const L = o => o ? (lang === "ar" ? (o.ar || o.en) : (o.en || o.ar)) : "";
  const asOf = fmtDate(meta.accessed || "2026-11-17");
  const next = fmtDate(meta.nextReview || "2027-11-17");
  const groups = [
    { key: "Vitamin", title: t.cats.Vitamin },
    { key: "Mineral", title: t.cats.Mineral },
    { key: "Herb", title: t.cats.Herb },
    { key: "Other", title: t.cats.Other },
    { key: "Topic", title: t.cats.Topic }
  ];
  const sortName = e => lang === "ar" ? arSortKey(displayName(e)) : displayName(e).toLowerCase();
  const byGroup = g => ENTRIES.filter(e => e.cat === g.key).sort((a, b) => {
    if(lang === "ar") return cmpAr(displayName(a), displayName(b));
    return sortName(a).localeCompare(sortName(b), "en");
  });

  const tableHTML = tbl => {
    if(!tbl || !tbl.rows?.length) return "";
    const cols = ["age", "male", "female"];
    if(tbl.rows.some(r => r.pregnancy?.en)) cols.push("pregnancy");
    if(tbl.rows.some(r => r.lactation?.en)) cols.push("lactation");
    return `<div class="pr-block">
      <table><thead><tr>${cols.map(c => `<th>${esc(L(tbl.headers[c]))}</th>`).join("")}</tr></thead>
      <tbody>${tbl.rows.map(r => `<tr>${cols.map(c => `<td>${esc(bidiRanges(L(r[c]) || "—"))}</td>`).join("")}</tr>`).join("")}</tbody></table>
      ${tbl.note ? `<p class="pr-muted">${esc(bidiRanges(L(tbl.note)))}</p>` : ""}
      ${tbl.source ? `<p class="pr-source"><a href="${esc(tbl.source.url)}">${esc(tbl.source.label)}</a> · ${esc(m.accessed)} ${esc(fmtDate(tbl.source.accessed))}</p>` : ""}
    </div>`;
  };

  const section = (title, body) => body ? `<div class="pr-block"><h3>${esc(title)}</h3>${body}</div>` : "";

  const entryHTML = (e, isFirst) => {
    const x = e.ng || {};
    const role = L(x.role) || (lang === "ar" ? (e.roleAr || e.role) : e.role);
    const foods = L(x.foods) || (lang === "ar" ? (e.foodsAr || e.foods) : e.foods);
    const rda = L(x.rda) || (lang === "ar" ? (e.rdaAr || e.rda) : e.rda);
    const ul = L(x.ul) || (lang === "ar" ? (e.ulAr || e.ul) : e.ul);
    const tips = lang === "ar" ? (e.tipsAr || e.tips) : e.tips;
    const alt = lang === "ar" ? e.name : (e.ar || "");
    let html = `<section class="pr-entry${isFirst ? " pr-first" : ""}">
      <div class="pr-entry-head">
        <div class="pr-kicker">${esc(t.cats[e.cat] || e.cat)}${x.classification ? " · " + esc(L(x.classification)) : ""}</div>
        <h2>${esc(displayName(e))}</h2>
        <div class="pr-entry-meta">${esc(alt)}${e.latin ? " · " + esc(e.latin) : ""}${e.source ? " · " + esc(e.source) : ""}</div>
      </div>
      <div class="pr-facts">
        <div class="pr-fact"><div class="lbl">${esc(m.rda)}</div><div class="val">${esc(bidiRanges(rda || "—"))}</div></div>
        <div class="pr-fact"><div class="lbl">${esc(m.ul)}</div><div class="val">${esc(bidiRanges(ul || "—"))}</div></div>
      </div>`;
    html += section(m.role, role ? `<p>${esc(bidiRanges(role))}</p>` : "");
    if(x.dri) html += section(m.dri, tableHTML(x.dri));
    if(x.ulTable) html += section(m.ulTable, tableHTML(x.ulTable));
    html += section(m.foods, foods ? `<p>${esc(bidiRanges(foods))}</p>` : "");
    if(x.enhance || x.inhibit){
      html += section(m.absorption,
        (x.enhance ? `<p><strong>${esc(m.enhance)}:</strong> ${esc(bidiRanges(L(x.enhance)))}</p>` : "") +
        (x.inhibit ? `<p><strong>${esc(m.inhibit)}:</strong> ${esc(bidiRanges(L(x.inhibit)))}</p>` : ""));
    }
    if(x.drugs?.length){
      const drugSrc = x.drugs.find(d => d.url)?.url || x.sources?.[0]?.url || "";
      const drugSource = (x.sources || []).find(s => s.url === drugSrc);
      const drugAccessed = drugSource?.accessed || meta.accessed;
      html += section(m.drugs, `<ul class="pr-list">${x.drugs.map(d =>
        `<li><span class="pr-sev">${esc(m.severity[d.sev] || m.severity.info)}:</span> ${esc(bidiRanges(L(d)))}</li>`).join("")}</ul>` +
        (drugSrc ? `<p class="pr-source"><a href="${esc(drugSrc)}">${esc(drugSource?.label || m.sources)}</a> · ${esc(m.accessed)} ${esc(fmtDate(drugAccessed))}</p>` : ""));
    } else if(x.category === "Herb"){
      html += section(m.drugs, `<p>${esc(m.noInteractions)}</p>`);
    }
    html += section(m.deficiency, x.deficiency ? `<p>${esc(bidiRanges(L(x.deficiency)))}</p>` : "");
    html += section(m.excess, x.excess ? `<p>${esc(bidiRanges(L(x.excess)))}</p>` : "");
    html += section(m.ulNote, x.ulNote ? `<p>${esc(bidiRanges(L(x.ulNote)))}</p>` : "");
    if(x.conflicts?.length) html += section(m.conflicts, `<ul class="pr-list">${x.conflicts.map(c => `<li>${esc(bidiRanges(L(c)))}</li>`).join("")}</ul>`);
    if(x.unverified?.length) html += section(m.unverified, `<ul class="pr-list">${x.unverified.map(c => `<li>${esc(bidiRanges(L(c)))}</li>`).join("")}</ul>`);
    if(tips && e.cat !== "Herb") html += section(m.tips, `<p>${esc(bidiRanges(tips))}</p>`);
    if(e.aliases?.length) html += section(m.aliases, `<p>${esc(e.aliases.join(" · "))}</p>`);
    if(x.sources?.length){
      html += section(m.sources, x.sources.map(s =>
        `<p class="pr-source"><a href="${esc(s.url)}">${esc(s.label)}</a> · ${esc(m.accessed)} ${esc(fmtDate(s.accessed))}</p>`).join(""));
    }
    html += `<p class="pr-footer-note">${esc(m.verified)}: ${esc(fmtDate(x.verified || meta.accessed))} · ${esc(m.nextReview)}: ${esc(fmtDate(x.nextReview || meta.nextReview))} · ${esc(m.sourceNote)}</p>`;
    html += `</section>`;
    return html;
  };

  let html = `<section class="pr-cover">
    <div class="pr-kicker">${esc(p.kicker)}</div>
    <h1>${esc(p.title)}</h1>
    <p class="pr-sub">${esc(p.subtitle)}</p>
    <div class="pr-rule"></div>
    <p><strong>${esc(p.edition)}</strong> · ${ENTRIES.length} ${esc(p.entries)} · ${esc(p.generated)} ${esc(asOf)}</p>
    <p class="pr-muted">${esc(p.langNote)}</p>
    <div class="pr-disclaimer"><strong>${esc(lang === "ar" ? "تنويه" : "Disclaimer")}:</strong> ${esc(p.coverDisclaimer)}</div>
    <p class="pr-muted">azzubair.ly/nutrient-glossary</p>
  </section>`;

  html += `<section class="pr-toc">
    <h2>${esc(p.contents)}</h2>
    <p class="pr-muted">${esc(p.tocHint)}</p>`;
  groups.forEach(g => {
    const items = byGroup(g);
    if(!items.length) return;
    html += `<h3>${esc(g.title)} (${items.length})</h3><ol>${items.map(e =>
      `<li>${esc(displayName(e))}${lang === "ar" ? "" : " — " + esc(e.ar || "")}</li>`).join("")}</ol>`;
  });
  html += `</section>`;

  html += `<section class="pr-about">
    <h2>${esc(p.about)}</h2>
    <p>${esc(p.aboutBody)}</p>
    <p>${esc(L(meta.sourceNote) || "")}</p>
    <p>${esc(L(meta.conflictNote) || "")}</p>
    <h3>${esc(p.verification)}</h3>
    <p>${esc(L(meta.reviewPolicy) || "")}</p>
    <p><strong>${esc(m.verified)}:</strong> ${esc(asOf)} · <strong>${esc(m.nextReview)}:</strong> ${esc(next)}</p>
    <div class="pr-disclaimer">${esc(L(meta.disclaimer) || "")}</div>
  </section>`;

  let first = true;
  groups.forEach(g => {
    byGroup(g).forEach(e => {
      html += entryHTML(e, first);
      first = false;
    });
  });

  root.innerHTML = html;
}

function exportPDF(){
  buildPrintDocument();
  const finish = () => {
    try { window.print(); }
    finally { document.title = UI[lang].docTitle; }
  };
  // Give the browser one frame to lay out the generated document before printing.
  requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(finish, 60)));
}

$("printBtn").onclick = exportPDF;

/* ============================================================================
   10. INTERACTIONS & DAILY TIMING
   ============================================================================ */
function renderInteractions(){
  const t = UI[lang];
  $("pickPills").innerHTML = PICKER_ITEMS.map(p => `
    <button class="pick-pill ${selectedPicks.has(p.id) ? "selected" : ""}" data-pick="${esc(p.id)}">
      ${esc(lang === "ar" ? p.ar : p.en)}
    </button>
  `).join("");

  $("pickPills").querySelectorAll(".pick-pill").forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.pick;
      if(selectedPicks.has(id)) selectedPicks.delete(id);
      else selectedPicks.add(id);
      renderInteractions();
    };
  });

  const shown = selectedPicks.size === 0
    ? INTERACTIONS
    : INTERACTIONS.filter(rule => {
        if(selectedPicks.size === 1) return rule.items.some(i => selectedPicks.has(i));
        // If 2+ selected, show rules matching at least 2 selected items, OR single-item safety warnings for any selected item
        const matchCount = rule.items.filter(i => selectedPicks.has(i)).length;
        return matchCount >= 2 || (rule.items.length === 1 && matchCount === 1);
      });

  $("interResults").innerHTML = shown.length
    ? shown.map(r => {
        const badge = r.type === "synergy" ? t.badgeSynergy : (r.type === "antagonism" ? t.badgeAntag : t.badgeCaution);
        return `<div class="inter-card ${r.type}">
          <span class="inter-badge">${badge}</span>
          <h4>${esc(bidiRanges(lang === "ar" ? r.titleAr : r.titleEn))}</h4>
          <p>${esc(bidiRanges(lang === "ar" ? r.descAr : r.descEn))}</p>
        </div>`;
      }).join("")
    : `<div class="empty-state" style="grid-column:1/-1;"><p>${t.noIntMatch}</p></div>`;

  $("timingGrid").innerHTML = TIMING_BLUEPRINT.map(b => `
    <div class="timing-card">
      <h4>${esc(bidiRanges(lang === "ar" ? b.titleAr : b.titleEn))}</h4>
      <ul>${(lang === "ar" ? b.itemsAr : b.itemsEn).map(li => `<li>${bidiRanges(li)}</li>`).join("")}</ul>
    </div>
  `).join("");
}

$("clearPicks").onclick = () => { selectedPicks.clear(); renderInteractions(); };

/* ============================================================================
   11. NIH DSLD v9 LIVE PRODUCT LABEL SEARCH
   ============================================================================ */
const DSLD_BASE = "https://api.ods.od.nih.gov/dsld/v9";

function renderDsldSuggestions(){
  const suggestions = ["Vitamin D3", "Magnesium Glycinate", "Iron", "Zinc", "Ashwagandha", "Vitamin B12"];
  $("dsldSuggestions").innerHTML = suggestions.map(s =>
    `<button class="chip" data-sq="${esc(s)}">${esc(s)}</button>`
  ).join("");
  $("dsldSuggestions").querySelectorAll(".chip").forEach(b => {
    b.onclick = () => { $("q").value = b.dataset.sq; searchLabels(0); };
  });
}

async function searchLabels(from = 0){
  const t = UI[lang];
  const q = $("q").value.trim();
  if(!q) return;
  dsldState = { q, from, size:18, total:0 };
  $("labels").innerHTML = "";
  $("labelPager").classList.add("hidden");
  $("labelmsg").innerHTML = `<div class="notice">${t.dsldSearching}</div>`;

  try {
    const url = `${DSLD_BASE}/browse-products?method=by_keyword&q=${encodeURIComponent(q)}&size=${dsldState.size}&from=${from}`;
    const r = await fetch(url);
    if(!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    const total = data.total?.value ?? 0;
    dsldState.total = total;
    const hits = data.hits || [];
    if(!hits.length){
      $("labelmsg").innerHTML = `<div class="notice">${t.dsldEmpty}</div>`;
      return;
    }

    $("labelmsg").innerHTML = `<div class="count-bar"><span>${t.dsldCount(hits.length, total)}</span></div>`;
    $("labels").innerHTML = hits.map(h => {
      const id = h._id || "";
      const p = h._source || {};
      const form = p.physicalState?.langualCodeDescription || "";
      const net = p.netContents?.[0]?.display || "";
      const srv = p.servingSizes?.[0];
      const srvText = srv ? `${srv.minQuantity ?? ""} ${srv.unit ?? ""}`.trim() : "";
      return `<article class="card label-card">
        <div class="card-top">
          <h3 dir="auto" style="cursor:default;text-align:start;">${esc(p.fullName || "Unnamed product")}</h3>
        </div>
        <div class="label-meta">
          ${p.brandName ? `<span class="src" dir="auto">${esc(p.brandName)}</span>` : ""}
          ${form ? `<span class="meta-pill" dir="ltr">${esc(form)}</span>` : ""}
          ${net ? `<span class="meta-pill" dir="ltr">${esc(net)}</span>` : ""}
          ${srvText ? `<span class="meta-pill" dir="ltr">${lang==="ar"?"حصة":"Serving"}: ${esc(srvText)}</span>` : ""}
        </div>
        <div id="ing-${esc(id)}"></div>
        <div class="card-foot">
          ${id ? `<button class="detail-btn" data-dsld-id="${esc(id)}">${t.dsldViewDetails}</button>` : ""}
          ${id ? `<a class="lnk" href="https://dsld.od.nih.gov/label/${encodeURIComponent(id)}" target="_blank" rel="noopener">${t.dsldFullLink}</a>` : ""}
        </div>
      </article>`;
    }).join("");

    if(total > dsldState.size){
      $("labelPager").classList.remove("hidden");
      const page = Math.floor(from / dsldState.size) + 1;
      const maxPage = Math.ceil(total / dsldState.size);
      $("labelPager").innerHTML = `
        <button class="btn-outline" id="dsldPrev" ${from <= 0 ? "disabled" : ""}>${t.dsldPrev}</button>
        <span style="font-size:.84rem;color:var(--muted);">${page} / ${maxPage}</span>
        <button class="btn-outline" id="dsldNext" ${from + dsldState.size >= total ? "disabled" : ""}>${t.dsldNext}</button>
      `;
      $("dsldPrev").onclick = () => searchLabels(Math.max(0, from - dsldState.size));
      $("dsldNext").onclick = () => searchLabels(from + dsldState.size);
    }
  } catch(e){
    $("labelmsg").innerHTML = `<div class="notice warn">Request failed (${esc(e.message)}). Search directly at <a href="https://dsld.od.nih.gov/" target="_blank" rel="noopener">dsld.od.nih.gov</a>.</div>`;
  }
}

$("labels").addEventListener("click", async ev => {
  const btn = ev.target.closest("[data-dsld-id]");
  if(!btn) return;
  const id = btn.dataset.dsldId;
  const box = document.getElementById(`ing-${id}`);
  if(!box) return;
  if(box.dataset.loaded === "1"){
    box.classList.toggle("hidden");
    return;
  }
  btn.disabled = true;
  btn.textContent = "…";
  try {
    const r = await fetch(`${DSLD_BASE}/label/${encodeURIComponent(id)}`);
    if(!r.ok) throw new Error("HTTP " + r.status);
    const lbl = await r.json();
    const rows = (lbl.ingredientRows || []).slice(0, 16).map(i => {
      const q = i.quantity?.[0];
      const amt = q ? `${q.quantity ?? ""} ${q.unit ?? ""}`.trim() : "—";
      const dv = q?.dailyValueTargetGroup?.[0]?.percent;
      const dvTxt = dv != null ? `${dv}%` : "—";
      return `<tr><td>${esc(i.name || "")}</td><td>${esc(amt)}</td><td>${esc(dvTxt)}</td></tr>`;
    }).join("");
    const other = (lbl.otheringredients?.ingredients || []).map(o => o.name).filter(Boolean).join(", ");
    const dir = (lbl.statements || []).find(s => (s.type || "").includes("Directions"))?.notes || "";
    box.innerHTML = `
      ${rows ? `<table><tr><th>Ingredient</th><th>Amount</th><th>%DV</th></tr>${rows}</table>` : ""}
      ${other ? `<p style="font-size:.77rem;color:var(--muted);margin:8px 0 0;"><strong>Other ingredients:</strong> ${esc(other)}</p>` : ""}
      ${dir ? `<p style="font-size:.77rem;color:var(--muted);margin:6px 0 0;"><strong>Directions:</strong> ${esc(dir)}</p>` : ""}
    `;
    box.dataset.loaded = "1";
    btn.textContent = UI[lang].dsldViewDetails;
  } catch(err){
    box.innerHTML = `<div class="notice warn" style="margin:8px 0;padding:8px 10px;font-size:.78rem;">Could not load label details (${esc(err.message)}).</div>`;
  } finally {
    btn.disabled = false;
  }
});

$("go").onclick = () => searchLabels(0);
$("q").addEventListener("keydown", e => { if(e.key === "Enter") searchLabels(0); });

/* ============================================================================
   12. NAVIGATION, SHORTCUTS & INIT
   ============================================================================ */
function showTab(tab){
  activeTab = tab;
  ["topics", "compare", "interactions", "labels"].forEach(t => {
    $(`panel-${t}`).classList.toggle("hidden", t !== tab);
    const btn = $(`tab-${t}`);
    btn.classList.toggle("active", t === tab);
    if(t === tab) btn.setAttribute("aria-current", "page");
    else btn.removeAttribute("aria-current");
  });
  document.body.classList.toggle("no-hero", tab !== "topics");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.onclick = () => showTab(btn.dataset.tab);
});

$("filter").addEventListener("input", renderGlossary);
$("clearSearch").onclick = () => { $("filter").value = ""; renderGlossary(); $("filter").focus(); };
$("category").addEventListener("change", () => {
  activeCat = $("category").value;
  activeSub = "";
  renderChips();
  renderGlossary();
});
$("sourceFilter").addEventListener("change", () => { renderGlossary(); updateMoreFiltersLabel(); });
$("sortMode").addEventListener("change", () => { renderGlossary(); updateMoreFiltersLabel(); });

function updateMoreFiltersLabel(){
  const n = ($("sourceFilter").value ? 1 : 0) + (($("sortMode").value || "az") !== "az" ? 1 : 0);
  $("moreFiltersBtn").textContent = n ? UI[lang].moreFiltersActive(n) : UI[lang].moreFilters;
  $("moreFiltersBtn").setAttribute("aria-label", UI[lang].moreFilters);
}

$("moreFiltersBtn").onclick = () => {
  const box = $("advFilters");
  box.classList.toggle("hidden");
  $("moreFiltersBtn").setAttribute("aria-expanded", String(!box.classList.contains("hidden")));
};

function renderDatalist(){
  const opts = new Set();
  ENTRIES.forEach(e => {
    opts.add(e.name);
    if(e.ar) opts.add(e.ar);
    (e.aliases || []).forEach(a => opts.add(a));
  });
  $("nutrientDatalist").innerHTML = [...opts].map(v => `<option value="${esc(v)}"></option>`).join("");
}

let tabLabelTimer;
window.addEventListener("resize", () => {
  clearTimeout(tabLabelTimer);
  tabLabelTimer = setTimeout(applyTabLabels, 150);
});

$("langBtn").onclick = () => {
  lang = lang === "en" ? "ar" : "en";
  savePrefs();
  applyLanguage();
};

$("themeBtn").onclick = () => {
  theme = theme === "light" ? "dark" : "light";
  savePrefs();
  applyTheme();
};

document.addEventListener("keydown", e => {
  if(e.key === "Escape") closeModal();
  if(e.key === "/" && !["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)){
    e.preventDefault();
    if(activeTab === "topics") $("filter").focus();
    else if(activeTab === "compare") $("cmpFilter").focus();
    else if(activeTab === "labels") $("q").focus();
  }
});

const toTop = $("toTop");
window.addEventListener("scroll", () => { toTop.style.display = window.scrollY > 450 ? "block" : "none"; });
toTop.onclick = () => window.scrollTo({ top:0, behavior:"smooth" });

applyTheme();
applyLanguage();
